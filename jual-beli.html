<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KIDPRENEUR – Game Simulasi Wirausaha</title>
<style>
:root{--blue:#1e88e5;--blued:#1565c0;--yellow:#ffca28;--yellowd:#f9a825;--orange:#ff9800;--oranged:#ef6c00;--green:#43a047;--greend:#2e7d32;--red:#e53935;--redd:#c62828;--ink:#1b2a41;--soft:#5b6b82}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:max(12px,min(1.05vw,1.9vh))}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:700;color:var(--ink);background:linear-gradient(160deg,#bbdefb 0%,#fff9c4 55%,#ffe0b2 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;font-weight:700;color:var(--ink)}
button{font-family:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:.8rem;padding:.5rem 1.2rem;background:linear-gradient(90deg,var(--blued),var(--blue));color:#fff;flex-wrap:wrap}
.brand{font-size:1.6rem;font-weight:900;letter-spacing:.05rem;cursor:pointer;display:flex;align-items:center;gap:.4rem}
.brand span{color:var(--yellow)}
.tb-mid{display:flex;gap:.5rem;flex:1;flex-wrap:wrap;justify-content:center}
.tpill{background:rgba(255,255,255,.2);border-radius:2rem;padding:.25rem .9rem;font-size:1rem;white-space:nowrap}
.tpill.cash{background:var(--yellow);color:var(--ink)}
#stages{display:flex;gap:.3rem;padding:.45rem 1rem;background:#fff;box-shadow:0 .2rem .6rem rgba(0,0,0,.08);overflow:hidden}
.stg{flex:1;min-width:0;text-align:center;font-size:.95rem;padding:.3rem .2rem;border-radius:1rem;background:#eceff1;color:#78909c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg.done{background:#c8e6c9;color:var(--greend)}
.stg.cur{background:var(--orange);color:#fff;transform:scale(1.06);box-shadow:0 .2rem .5rem rgba(239,108,0,.4)}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:1rem 1.5rem}
#nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.5rem;background:rgba(255,255,255,.85);box-shadow:0 -.2rem .6rem rgba(0,0,0,.08)}
#nav .mid{display:flex;gap:.6rem}
.btn{font-size:1.25rem;font-weight:900;padding:.7rem 1.5rem;min-height:3.2rem;border:0;border-radius:1.2rem;cursor:pointer;color:#fff;box-shadow:0 .3rem 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(.25rem);box-shadow:0 .05rem 0 rgba(0,0,0,.22)}
.btn:hover{filter:brightness(1.07)}
.btn.sm{font-size:1rem;padding:.4rem .9rem;min-height:2.6rem;border-radius:.9rem}
.btn.xl{font-size:1.6rem;padding:1rem 2.2rem;min-height:4rem}
.b-blue{background:var(--blue)}.b-green{background:var(--green)}.b-orange{background:var(--orange)}.b-red{background:var(--red)}.b-gray{background:#78909c}.b-yellow{background:var(--yellow);color:var(--ink)}.b-purple{background:#7e57c2}
.card{background:#fff;border-radius:1.4rem;padding:1.1rem 1.3rem;box-shadow:0 .3rem 1rem rgba(21,101,192,.15)}
h1,h2,h3{margin:0 0 .5rem}
h2{font-size:2rem}h3{font-size:1.4rem}
p{margin:.3rem 0;line-height:1.45}
.sub{color:var(--soft);font-size:1.1rem}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:1.2rem;align-items:start}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tip{background:#ede7f6;border:.2rem dashed #7e57c2;border-radius:1.2rem;padding:.6rem 1rem;margin-bottom:.8rem;font-size:1.05rem;color:#4527a0}
/* home */
.home{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100%}
.logo-big{font-size:4.6rem;font-weight:900;line-height:1;color:var(--blued);text-shadow:.2rem .2rem 0 var(--yellow)}
.logo-big span{color:var(--orange)}
.tagline{font-size:1.6rem;color:var(--oranged);margin:.6rem 0 1.4rem}
.home-btns{display:grid;gap:.9rem;max-width:30rem}
.hero-svg{width:100%;max-height:70vh;filter:drop-shadow(0 .5rem 1rem rgba(0,0,0,.2));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-.6rem)}}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem}
.chip{background:#fff;border-radius:2rem;padding:.3rem .9rem;font-size:1rem;box-shadow:0 .1rem .4rem rgba(0,0,0,.12)}
/* register */
.center{max-width:34rem;margin:1rem auto}
.center label{display:block;font-size:1.2rem;margin:1rem 0 .3rem}
.inp{width:100%;font-size:1.5rem;padding:.7rem 1rem;border:.2rem solid #90caf9;border-radius:1rem;outline:none;background:#fff}
.inp:focus{border-color:var(--orange)}
.capital{margin-top:1.2rem;background:linear-gradient(90deg,#fff59d,#ffe082);border-radius:1.2rem;padding:.8rem 1.2rem;font-size:1.5rem;text-align:center}
/* product */
.tabs{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{font-size:1.2rem;font-weight:900;padding:.6rem 1.2rem;border:0;border-radius:1.2rem;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 .2rem .5rem rgba(0,0,0,.12)}
.tab.on{background:var(--orange);color:#fff}
.pcard{background:#fff;border-radius:1.4rem;padding:1rem;text-align:center;cursor:pointer;border:.25rem solid transparent;box-shadow:0 .3rem .8rem rgba(0,0,0,.12);transition:transform .15s}
.pcard:hover{transform:translateY(-.2rem)}
.pcard.on{border-color:var(--orange);background:#fff8e1;transform:scale(1.04)}
.pcard .em{font-size:4rem;line-height:1.1}
.pcard .nm{font-size:1.3rem;font-weight:900}
.detail{position:sticky;top:0;text-align:center}
.detail .em{font-size:6rem;animation:float 3s ease-in-out infinite}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:1rem;font-size:.8rem;padding:.05rem .5rem;white-space:nowrap}
.ichips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.6rem 0}
.ichips span{background:#e3f2fd;border-radius:1rem;padding:.2rem .7rem;font-size:.95rem}
/* shop */
.ing{background:#fff;border-radius:1.2rem;padding:.8rem;text-align:center;border:.2rem solid transparent;box-shadow:0 .2rem .6rem rgba(0,0,0,.1)}
.ing.has{border-color:var(--green);background:#f1f8e9}
.ing-e{font-size:2.8rem;line-height:1.1}.ing-n{font-size:1.15rem;font-weight:900}.ing-p{font-size:1.1rem;color:var(--oranged)}.ing-c{font-size:.9rem;color:var(--soft);margin:.2rem 0 .5rem}
.qty{display:flex;align-items:center;justify-content:center;gap:.5rem}
.qty span{font-size:1.5rem;min-width:2rem;font-weight:900}
.qb{width:2.8rem;height:2.8rem;border:0;border-radius:50%;background:#ffcc80;font-size:1.6rem;font-weight:900;cursor:pointer;color:var(--ink)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.8rem}
.cart{position:sticky;top:0}
.crow{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:.1rem dashed #cfd8dc;font-size:1rem}
.crow .nm{flex:1;min-width:0}
.crow .sb{font-weight:900;white-space:nowrap}
.mini{border:0;border-radius:.6rem;background:#eceff1;width:2rem;height:2rem;font-size:1.1rem;font-weight:900;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.3rem;margin-top:.5rem}
.meter{height:1rem;border-radius:1rem;background:#eceff1;overflow:hidden;margin:.5rem 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .3s}
.est{background:#e8f5e9;border-radius:1rem;padding:.7rem;margin-top:.6rem;font-size:1.05rem}
.est.no{background:#fff3e0}
.pos{color:var(--greend)}.neg{color:var(--redd)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
/* production */
.cook{font-size:3rem;text-align:center;min-height:5rem;display:flex;flex-wrap:wrap;gap:.2rem;justify-content:center}
.pop{display:inline-block;animation:pop .5s backwards;font-size:2.6rem}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.stat{background:#fff;border-radius:1.2rem;padding:.8rem;text-align:center;box-shadow:0 .2rem .7rem rgba(0,0,0,.1)}
.stat .ic{font-size:2rem}.stat .lb{font-size:1rem;color:var(--soft)}.stat .vl{font-size:1.8rem;font-weight:900}
.stat.hot{background:#fff8e1;border:.2rem solid var(--yellow)}
.stat.big .vl{font-size:2.2rem}
.formula{background:#e3f2fd;border-radius:1.2rem;padding:.8rem 1.1rem;font-size:1.2rem;margin:.8rem 0}
.formula b{color:var(--blued)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.msg{min-height:1.4rem;color:var(--oranged);margin-top:.4rem}
/* pricing */
.popt{font-size:1.6rem;font-weight:900;padding:.7rem 1.3rem;border:.2rem solid #90caf9;border-radius:1.2rem;background:#fff;cursor:pointer;color:var(--blued)}
.popt.on{background:var(--orange);color:#fff;border-color:var(--oranged)}
.bigprice{font-size:3rem;font-weight:900;color:var(--oranged);text-align:center}
/* sim */
.scene{position:relative;height:clamp(15rem,34vh,24rem);border-radius:1.6rem;overflow:hidden;background:linear-gradient(#81d4fa 0%,#e1f5fe 62%,#a5d6a7 62%,#81c784 100%);box-shadow:0 .3rem 1rem rgba(0,0,0,.2)}
.scene .sun{position:absolute;right:3%;top:5%;font-size:3rem}
.scene .cl{position:absolute;font-size:3rem;opacity:.9;animation:drift 20s linear infinite}
@keyframes drift{from{transform:translateX(-4rem)}to{transform:translateX(40rem)}}
.stall{position:absolute;left:3%;bottom:6%;width:54%}
.awning{height:3.2rem;border-radius:1rem 1rem 0 0;background:repeating-linear-gradient(90deg,var(--orange) 0 2.2rem,#fff 2.2rem 4.4rem);box-shadow:0 .3rem .4rem rgba(0,0,0,.2)}
.sign{position:absolute;left:50%;top:-1.7rem;transform:translateX(-50%);background:var(--blue);color:#fff;padding:.2rem 1.2rem;border-radius:1rem;font-size:1.3rem;white-space:nowrap;font-weight:900}
.counter{background:#ffb74d;border-radius:0 0 1rem 1rem;min-height:5.2rem;padding:.3rem .5rem;border-top:.3rem solid #8d6e63;display:flex;align-items:flex-end}
.stockrow{font-size:1.4rem;line-height:1.15;display:flex;flex-wrap:wrap;gap:0 .05rem;max-height:4.6rem;overflow:hidden}
.seller{position:absolute;left:59%;bottom:10%;text-align:center}
.av{font-size:4.5rem;line-height:1}
.nm2{font-size:.95rem;background:rgba(255,255,255,.85);border-radius:1rem;padding:0 .6rem;display:inline-block}
.buyer{position:absolute;right:4%;bottom:10%;text-align:center;transform:translateX(150%);opacity:0;transition:transform .55s ease,opacity .55s}
.buyer.in{transform:none;opacity:1}
.buyer .av{font-size:5rem}
.react{position:absolute;top:-2.4rem;left:50%;transform:translateX(-50%);font-size:2.4rem;animation:pop .4s}
.dialog{margin-top:.8rem;display:grid;gap:.5rem}
.bub{border-radius:1.2rem;padding:.6rem 1rem;font-size:1.3rem;min-height:3rem;display:flex;gap:.6rem;align-items:center}
.bub.b{background:#fff3e0;border:.15rem solid var(--orange)}
.bub.s{background:#e3f2fd;border:.15rem solid var(--blue)}
.bub .who{font-size:1rem;color:var(--soft);min-width:5rem}
.coin{position:absolute;font-size:1.6rem;font-weight:900;color:#f57f17;text-shadow:0 0 .3rem #fff;animation:coinup 1.3s forwards;pointer-events:none;z-index:5}
@keyframes coinup{from{transform:translateY(0);opacity:1}to{transform:translateY(-8rem);opacity:0}}
.log{max-height:11rem;overflow-y:auto;font-size:1rem}
.log div{padding:.25rem .4rem;border-bottom:.1rem dashed #cfd8dc}
.sline{font-size:1.2rem;display:flex;justify-content:space-between;padding:.2rem 0}
.simtip{margin-top:.6rem;background:#fffde7;border-radius:1rem;padding:.5rem .9rem;font-size:1.05rem;min-height:2.6rem}
/* report */
.banner{border-radius:1.6rem;padding:1.2rem;text-align:center;font-size:2.2rem;font-weight:900;color:#fff;animation:pop .6s}
.banner.untung{background:linear-gradient(90deg,var(--green),#66bb6a)}
.banner.rugi{background:linear-gradient(90deg,var(--orange),var(--red))}
.banner.impas{background:linear-gradient(90deg,var(--blue),#4fc3f7)}
.mask{font-size:1.6rem;color:#90a4ae}
.why li{margin:.35rem 0;font-size:1.1rem;line-height:1.4}
/* worksheet */
.paper{background:#fff;border-radius:1rem;padding:1.4rem 2rem;box-shadow:0 .3rem 1.2rem rgba(0,0,0,.2);max-width:56rem;margin:0 auto}
.paper h2{text-align:center;color:var(--blued);margin-bottom:.2rem}
.pmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem 1rem;font-size:1.05rem;border-bottom:.15rem solid var(--blue);padding-bottom:.6rem;margin-bottom:.6rem}
.qa{margin:.9rem 0}.qa .q{font-size:1.2rem;font-weight:900}
.auto{background:#e8f5e9;border-radius:.8rem;padding:.4rem .8rem;font-size:1.25rem;margin-top:.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.auto small{color:var(--soft);font-size:.95rem}
/*ln*/.ln{border-bottom:.12rem solid #78909c;height:2.1rem}
.blank{display:inline-block;min-width:12rem;border-bottom:.12rem solid #78909c;height:1.3rem;vertical-align:bottom}
/*pre*/.fill{display:inline-block;min-width:7rem;border-bottom:.12rem solid #78909c;height:1.2rem;vertical-align:bottom}
.prev h1{font-size:1.5rem;text-align:center;margin:0;color:var(--blued)}.prev .ph{text-align:center;color:var(--soft);margin-bottom:.4rem}
.prev table{width:100%;border-collapse:collapse;margin:.4rem 0}.prev th,.prev td{border:.1rem solid #607d8b;padding:.25rem .5rem;font-size:1rem;text-align:left;height:2rem}.prev th{background:#e3f2fd}
.prev h4{margin:.8rem 0 .2rem;background:#fff3e0;padding:.2rem .6rem;border-radius:.5rem;font-size:1.1rem}.prev .pq{margin:.5rem 0;font-size:1.05rem}.prev .box{border:.1rem solid #607d8b;padding:.4rem .7rem;margin-top:.6rem;border-radius:.5rem}
/*pl*/.prev .pg2{margin-top:1.2rem;border-top:.2rem dashed #90a4ae;padding-top:.6rem}
.prev .plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.prev table.pl{margin:0}.prev table.pl th{font-size:.95rem}.prev table.pl td{font-size:.8rem;height:auto;padding:.1rem .35rem}
.prev table.pl td.pc{width:34%}.prev table.pl td.py{width:22%}
textarea.ta{width:100%;min-height:5rem;font-size:1.2rem;padding:.6rem .8rem;border:.15rem solid #90caf9;border-radius:.9rem;resize:vertical;outline:none;margin-top:.25rem}
textarea.ta:focus{border-color:var(--orange)}
/* awards */
.score{width:11rem;height:11rem;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#eceff1 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.score div{width:8.6rem;height:8.6rem;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;font-weight:900}
.score small{font-size:1rem;color:var(--soft)}
.award{text-align:center;padding:.8rem;border-radius:1.2rem;background:#fff;box-shadow:0 .2rem .6rem rgba(0,0,0,.12)}
.award .ic{font-size:3.2rem}.award.off{filter:grayscale(1);opacity:.45}.award.on{background:#fff8e1;border:.2rem solid var(--yellow);animation:pop .6s}
.bar{height:1rem;background:#eceff1;border-radius:1rem;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
/* modal */
#modalRoot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,30,60,.6);padding:1rem}
#modalRoot.show{display:flex}
.modal{background:#fff;border-radius:1.6rem;max-width:62rem;width:100%;max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:1.4rem 1.8rem;position:relative;animation:pop .3s}
.modal .x{position:absolute;right:.8rem;top:.8rem}
.modal ul,.modal ol{padding-left:1.5rem;font-size:1.15rem;line-height:1.5}
.bigq{font-size:2.6rem;text-align:center;padding:2rem 1rem;line-height:1.3;color:var(--blued)}
.seg{display:flex;gap:.5rem;flex-wrap:wrap}
.seg button{font-size:1.1rem;font-weight:900;padding:.5rem 1rem;border:.15rem solid #90caf9;background:#fff;border-radius:1rem;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blued)}
.srow{margin:.9rem 0}.srow>b{display:block;margin-bottom:.3rem;font-size:1.15rem}
table.tb{width:100%;border-collapse:collapse;font-size:1rem}
table.tb th,table.tb td{border:.1rem solid #cfd8dc;padding:.3rem .5rem;text-align:left}
table.tb th{background:#e3f2fd}
#toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%) translateY(2rem);background:#263238;color:#fff;padding:.8rem 1.6rem;border-radius:2rem;font-size:1.2rem;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.conf{position:fixed;top:-3rem;animation:fall linear forwards;pointer-events:none;z-index:80}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#printArea{display:none}
@media (max-width:900px){
 .two,.home,.g3,.g4{grid-template-columns:1fr!important}
 .g2{grid-template-columns:1fr 1fr}
 .logo-big{font-size:3rem}
 .cart,.detail{position:static}
 .stg{font-size:.7rem}
 .stg .t{display:none}
 .pmeta{grid-template-columns:1fr}
}
@media print{
 @page{size:A4;margin:12mm}
 html,body{height:auto!important;overflow:visible!important;background:#fff!important}
 #app,#modalRoot,#fxRoot,#toast{display:none!important}
 #printArea{display:block!important;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10.5pt;font-weight:400}
 #printArea h1{text-align:center;font-size:17pt;margin:0 0 2mm}
 #printArea .ph{text-align:center;font-size:10pt;margin-bottom:4mm}
 #printArea table{width:100%;border-collapse:collapse;margin:2mm 0 3mm}
 #printArea td,#printArea th{border:.3mm solid #000;padding:1.5mm 2mm;font-size:10.5pt;text-align:left}
 #printArea th{background:#ddd;width:17%}
 #printArea .pq{margin:1.6mm 0;break-inside:avoid}
 #printArea .pq b{font-weight:700}
 #printArea h4{margin:2.5mm 0 1mm;font-size:11pt;background:#ddd;padding:.8mm 2mm}
 #printArea .pg2{break-before:page}
 #printArea .plist{column-count:2;column-gap:5mm}
 #printArea table.pl{width:100%;margin:0 0 1.3mm;break-inside:avoid}
 #printArea table.pl th{width:auto;font-size:8.5pt;padding:.6mm 1.5mm}
 #printArea table.pl td{font-size:7pt;padding:.2mm 1mm;height:auto;line-height:1.15}
 #printArea table.pl td.pc{width:34%}
 #printArea table.pl td.py{width:22%}
 #printArea table.plan th{width:auto}
 #printArea table.plan td{height:7mm}
 #printArea .fill{display:inline-block;min-width:30mm;border-bottom:.3mm solid #555;height:4.5mm;vertical-align:bottom}
 #printArea .ln{border-bottom:.3mm solid #555;height:6.6mm}
 #printArea td{height:8mm}
 #printArea .box{border:.4mm solid #000;padding:2mm 3mm;margin:3mm 0}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <div id="stages"></div>
  <main id="main"></main>
  <footer id="nav"></footer>
</div>
<div id="modalRoot"></div>
<div id="fxRoot"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ================= UTIL ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>{n=Math.round(n);const neg=n<0;return (neg?'-':'')+'Rp'+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const round500=x=>Math.round(x/500)*500;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function parseNum(s){if(s==null)return NaN;s=String(s).replace(/[−–—]/g,'-').replace(/rp/ig,'').replace(/[.\s,]/g,'');return /^-?\d+$/.test(s)?parseInt(s,10):NaN;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

let AC=null;
function ac(){if(!S.sound&&!S.voice)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,d,type,vol,slide){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();const t=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const SFX={

 add(){tone(520,0,.08,'sine',.16);tone(780,.07,.1,'sine',.16);},

let VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis?speechSynthesis.getVoices():[];}catch(e){VOICES=[];}}
try{loadVoices();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function idVoice(){return VOICES.find(v=>/^id/i.test(v.lang))||null;}
function hashN(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function stopVoice(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function babble(text,who,done){
  if(!ac()){done();return;}
  const h=hashN(who.n);const base=260+(h%9)*55;const n=Math.min(16,Math.max(4,Math.round(text.length/4)));let t=0;
  for(let i=0;i<n;i++){const f=base*(.85+(hashN(text+i)%40)/100);tone(f,t,.07,'triangle',.1,f*1.15);t+=.09;}
  setTimeout(done,t*1000+100);
}
function speak(text,who){
  return new Promise(res=>{
    if(!S.voice){res();return;}
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    try{
      const clean=String(text).replace(/Rp(\d[\d.]*\d|\d)/g,(m,n)=>n.replace(/\./g,'')+' rupiah').replace(/[^\p{L}\p{N}\s.,?!']/gu,' ');
      const v=idVoice();
      if(v&&window.speechSynthesis){
        stopVoice();const u=new SpeechSynthesisUtterance(clean);u.voice=v;u.lang=v.lang;u.pitch=.9+(hashN(who.n)%10)/10*.9;u.rate=1;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,6500);
      }else babble(clean,who,fin);
    }catch(e){fin();}
  });
}

const prod=()=>P.find(x=>x.id===G.productId);
const ING=id=>prod().ings.find(i=>i.id===id);
function cartTotal(){return Object.keys(G.cart).reduce((s,id)=>s+G.cart[id]*ING(id).price,0);}
function estimate(){
  const p=prod();let min=Infinity,limiting=null;const missing=[];
  p.ings.filter(i=>!i.opt).forEach(i=>{const q=G.cart[i.id]||0;const cap=Math.floor(q*i.yld);if(q===0)missing.push(i);if(cap<min){min=cap;limiting=i;}});
  return {produced:(min===Infinity||missing.length)?0:min,limiting,missing};
}
function cashNow(){
  if(!G||!G.productId)return G?G.capital:S.capital;
  if(screen==='shop')return G.capital-cartTotal();
  if(['production','pricing'].includes(screen))return G.capital-G.totalCost;
  if(G.sim&&['sim','report','worksheet','awards'].includes(screen)){return (screen==='report'&&!G.revealed)?G.capital-G.totalCost:G.capital-G.totalCost+G.sim.revenue;}
  return G.capital;
}

function closeModal(){const r=$('#modalRoot');r.classList.remove('show');r.innerHTML='';}
let confirmFn=null;
function confirmBox(msg,yes,fn){confirmFn=fn;const r=$('#modalRoot');r.innerHTML='<div class="modal" style="max-width:34rem;text-align:center"><div style="font-size:3.5rem">❓</div><h3>'+msg+'</h3><div class="row" style="justify-content:center;margin-top:1rem"><button class="btn b-gray" onclick="closeModal()">BATAL</button><button class="btn b-red" onclick="doConfirm()">'+yes+'</button></div></div>';r.classList.add('show');}
function doConfirm(){const f=confirmFn;confirmFn=null;closeModal();if(f)f();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal();});

/* ================= CHROME (topbar/stages/nav) ================= */
function renderTop(){
  let mid='';
  if(G&&screen!=='home'){mid='<span class="tpill">👤 '+esc(G.name||'Pengusaha')+(G.group?' • '+esc(G.group):'')+'</span>';if(G.productId)mid+='<span class="tpill">'+prod().e+' '+prod().name+'</span>';mid+='<span class="tpill cash">💰 Kas: '+rp(cashNow())+'</span>';}
  $('#topbar').innerHTML='<div class="brand" onclick="goHome()">🧑‍🍳 KID<span>PRENEUR</span></div><div class="tb-mid">'+mid+'</div><span class="tpill">'+(S.mode==='demo'?'👩‍🏫 Mode Demonstrasi':'🎮 Mode Siswa')+'</span><button class="btn b-gray sm" onclick="togSound()">'+(S.sound?'🔊 EFEK':'🔇 EFEK')+'</button><button class="btn b-gray sm" onclick="togVoice()">'+(S.voice?'🗣️ SUARA':'🤐 SUARA')+'</button><button class="btn b-yellow sm" onclick="openTeacher()">🧑‍🏫 GURU</button>';
}
function renderStages(){
  const el=$('#stages');const idx=STAGES.findIndex(s=>s[0]===screen);
  if(idx<0){el.style.display='none';return;}el.style.display='flex';
  el.innerHTML=STAGES.map((s,i)=>'<div class="stg '+(i<idx?'done':i===idx?'cur':'')+'">'+(i<idx?'✅':s[2])+' <span class="t">'+(i+1)+'. '+s[1]+'</span></div>').join('');
}
function renderNav(){
  const c=SCREENS[screen].nav?SCREENS[screen].nav():{};
  const mid=(S.mode==='demo'&&screen!=='home')?'<button class="btn b-purple" onclick="openTeacher(\'disc\')">💬 SOAL DISKUSI</button>':'';
  $('#nav').innerHTML=(c.back?'<button class="btn b-gray" onclick="'+c.back.fn+'">◀ '+c.back.label+'</button>':'<span></span>')+'<div class="mid">'+mid+'</div>'+(c.next?'<button class="btn '+(c.next.cls||'b-green')+' xl" id="navNext" onclick="'+c.next.fn+'">'+c.next.label+' ▶</button>':'<span></span>');
  $('#nav').style.display=screen==='home'?'none':'flex';
}
function demoTip(k){if(S.mode!=='demo')return '';const t={product:'Ajak siswa berdiskusi: produk apa yang paling disukai teman-teman? Apa saja bahan bakunya?',shop:'Tanya siswa: bahan apa yang wajib dibeli supaya produk jadi? Apa yang terjadi kalau sedotan atau gelasnya kurang?',production:'Tanya siswa: mengapa modal per produk dihitung dari total belanja dibagi jumlah produk?',pricing:'Minta siswa menebak: kalau harga dinaikkan, pembeli bertambah atau berkurang? Mengapa?',sim:'Berhenti sejenak setelah ada pembeli yang menolak. Tanya: apa yang dipikirkan pembeli itu?',report:'Diskusikan: apakah omzet dan keuntungan itu sama? Mengapa berbeda?',worksheet:'Cetak lembar ini dan bagikan. Siswa mengisi identitas dan jawaban dengan pensil, lalu minta beberapa siswa membacakan jawabannya.',awards:'Beri apresiasi pada proses berpikir siswa, bukan hanya pada besarnya keuntungan.'}[k];return t?'<div class="tip">👩‍🏫 <b>Pertanyaan pemantik guru:</b> '+t+'</div>':'';}

/* ================= NAV / FLOW ================= */
function go(n){simToken++;simBusy=false;stopVoice();screen=n;render();$('#main').scrollTop=0;}
function render(keep){
  const m=$('#main');const st=m.scrollTop;
  renderTop();renderStages();
  m.innerHTML=SCREENS[screen].html();
  renderNav();
  if(keep)m.scrollTop=st;
  if(SCREENS[screen].after)SCREENS[screen].after();
}
function goHome(){if(!G||screen==='home'){go('home');return;}confirmBox('Kembali ke beranda? Permainan yang sedang berjalan akan dihapus.','YA, KE BERANDA',()=>{G=null;go('home');});}
function resetAll(){confirmBox('Reset permainan? Semua data permainan yang sedang berjalan akan dihapus.','YA, RESET',()=>{G=null;ui.sel=null;closeModal();go('home');setTimeout(()=>toast('Permainan sudah di-reset ✅'),50);});}

function chooseProd(){
  if(!ui.sel){toast('Pilih satu produk dulu ya! 👆');return;}

/* ---- SHOP ---- */
function shopGrid(){const p=prod();return p.ings.map(i=>{const q=G.cart[i.id]||0;return '<div class="ing '+(q?'has':'')+'" id="ing_'+i.id+'"><div class="ing-e">'+i.e+'</div><div class="ing-n">'+esc(i.name)+'</div>'+(i.opt?'<span class="badge">✨ opsional</span>':'')+'<div class="ing-p">'+rp(i.price)+'/'+i.unit+'</div><div class="ing-c">'+(i.opt?'Topping: 1 '+i.unit+' untuk ±'+i.yld+' '+p.unit+'.<br><b>Tidak membatasi jumlah produksi.</b>':'1 '+i.unit+' cukup untuk ±'+i.yld+' '+p.unit)+'</div><div class="qty"><button class="qb" onclick="chg(\''+i.id+'\',-1)">−</button><span>'+q+'</span><button class="btn b-green sm" onclick="chg(\''+i.id+'\',1)">+ TAMBAH</button></div></div>';}).join('');}
function cartHtml(){
  const p=prod();const ids=Object.keys(G.cart);const tot=cartTotal();const left=G.capital-tot;const e=estimate();
  const rows=ids.length?ids.map(id=>{const i=ING(id);const q=G.cart[id];return '<div class="crow"><span style="font-size:1.6rem">'+i.e+'</span><div class="nm">'+esc(i.name)+'<br><small>'+q+' × '+rp(i.price)+'</small></div><button class="mini" onclick="chg(\''+id+'\',-1)">−</button><button class="mini" onclick="chg(\''+id+'\',1)">+</button><div class="sb">'+rp(q*i.price)+'</div><button class="btn b-red sm" onclick="delItem(\''+id+'\')">HAPUS</button></div>';}).join(''):'<p class="sub" style="text-align:center;padding:1rem">Keranjang masih kosong.<br>Sentuh <b>+ TAMBAH</b> pada bahan di sebelah kiri 👈</p>';
  let est;
  if(e.produced>0)est='<div class="est">🍳 Dengan bahan ini kamu bisa membuat <b>'+e.produced+' '+p.unit+' '+p.name+'</b>.<br><small>Bahan yang paling menentukan jumlah: '+e.limiting.e+' '+esc(e.limiting.name)+'</small></div>';
  else if(!ids.length)est='<div class="est no">🍳 Pilih bahan dulu untuk melihat perkiraan hasil produksi.</div>';
  else est='<div class="est no">⚠️ Belum bisa produksi. Masih kurang: '+e.missing.map(i=>i.e+' '+esc(i.name)).join(', ')+'</div>';
  const op=p.ings.find(x=>x.opt);
  if(op&&G.cart[op.id]&&e.produced>0){const tp=Math.min(e.produced,Math.floor(G.cart[op.id]*op.yld));est+='<div class="est '+(tp<e.produced?'no':'')+'">✨ '+esc(op.name)+' cukup untuk <b>'+tp+' dari '+e.produced+' '+p.unit+'</b>.'+(tp<e.produced?' Sisanya '+(e.produced-tp)+' '+p.unit+' <b>tanpa topping</b>, kurang menarik bagi pembeli.':' Semua produk memakai topping!')+'</div>';}
  return '<h3>🛒 Keranjang Belanja</h3>'+rows+'<div class="tot"><span>Total belanja</span><b>'+rp(tot)+'</b></div><div class="tot"><span>Sisa modal</span><b class="'+(left<0?'neg':'pos')+'">'+rp(left)+'</b></div><div class="meter"><i style="width:'+Math.min(100,tot/G.capital*100)+'%"></i></div><div class="sub" style="font-size:.9rem">Modal awal: '+rp(G.capital)+'</div>'+est+'<div style="margin-top:.6rem"><button class="btn b-gray sm" onclick="clearCart()">🗑️ KOSONGKAN KERANJANG</button></div>';
}
SCREENS.shop={
 html(){return demoTip('shop')+`<h2>🛒 Belanja Bahan Baku di Pasar</h2><p class="sub">Belilah bahan untuk membuat <b>${prod().name}</b>. Kamu tidak boleh belanja lebih dari modalmu (${rp(G.capital)})!</p>
 <div class="two" style="grid-template-columns:2fr 1.1fr"><div class="shopgrid" id="shopGrid">${shopGrid()}</div><div class="card cart" id="cartBox">${cartHtml()}</div></div>`;},
 nav(){return {back:{label:'KEMBALI',fn:"go('product')"},next:{label:'SELESAI BELANJA – LANJUT PRODUKSI',fn:'toProduction()'}};}
};
function refreshShop(){const g=$('#shopGrid'),c=$('#cartBox');if(!g||!c)return;const m=$('#main');const gs=m.scrollTop;const cs=c.scrollTop;g.innerHTML=shopGrid();c.innerHTML=cartHtml();c.scrollTop=cs;m.scrollTop=gs;renderTop();}
function chg(id,d){
  const i=ING(id);const q=(G.cart[id]||0)+d;if(q<0)return;
  if(d>0&&cartTotal()+i.price>G.capital){toast('Uangmu tidak cukup! Sisa modal '+rp(G.capital-cartTotal()));shake(id);return;}
  if(q<=0)delete G.cart[id];else G.cart[id]=q;snd(d>0?'add':'pop');refreshShop();
}
function delItem(id){delete G.cart[id];snd('pop');refreshShop();}
function clearCart(){if(!Object.keys(G.cart).length){toast('Keranjang sudah kosong.');return;}confirmBox('Kosongkan seluruh keranjang belanja?','YA, KOSONGKAN',()=>{G.cart={};refreshShop();});}
function toProduction(){
  const e=estimate();
  if(e.produced<1){toast(Object.keys(G.cart).length?'Bahan belum lengkap: '+e.missing.map(i=>i.name).join(', '):'Belanja bahan dulu ya!');return;}
  const sig=JSON.stringify(G.cart);
  G.produced=e.produced;G.totalCost=cartTotal();G.mpuExact=G.totalCost/G.produced;G.mpu=Math.round(G.mpuExact);
  const opt=prod().ings.find(i=>i.opt);G.hasOpt=!!(opt&&G.cart[opt.id]);G.topped=G.hasOpt?Math.min(G.produced,Math.floor(G.cart[opt.id]*opt.yld)):0;
  const cover=G.hasOpt?G.topped/G.produced:0;G.quality=1;G.stars=3+(cover>=.5?1:0)+(cover>=.99?1:0);
  if(sig!==G.sig){G.sig=sig;G.sim=null;G.price=null;G.revealed=false;G.result=null;G.scores=null;G.calc.mpu={tries:0,score:0,done:false,shown:false};G.calc.profit={tries:0,score:0,done:false,shown:false};}
  go('production');
}

/* ---- PRODUCTION ---- */
function leftovers(){const p=prod();const out=[];p.ings.filter(i=>!i.opt).forEach(i=>{const cap=Math.floor((G.cart[i.id]||0)*i.yld);if(cap-G.produced>=1)out.push({i,extra:cap-G.produced});});return out;}

   <div class="stat"><div class="ic">${p.e}</div><div class="lb">Jumlah produk yang dibuat</div><div class="vl">${G.produced} ${p.unit}</div></div>

/* ---- SIMULASI PEMBELI ---- */
function initSim(){
  const rnd=mulberry32(G.seed);const first=BUYERS.slice(0,5),rest=BUYERS.slice(5);
  const N=Math.max(10,Math.min(20,S.buyers));
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  const list=first.concat(rest.slice(0,N-5));
  for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  G.sim={price:G.price,diff:S.diff,queue:list.map(b=>({b,u:rnd(),jit:.93+rnd()*.14})),i:0,stock:G.produced,topped:G.topped||0,sold:0,revenue:0,nBuy:0,refMahal:0,refBudget:0,lost:0,log:[],done:false,tip:'Tekan tombol untuk memanggil pembeli pertama.'};
}
function evalBuyer(it){
  const s=G.sim,b=it.b,p=prod(),price=G.price,u=p.unit;
  const dm={mudah:1.15,sedang:1,sulit:.88}[s.diff]||1;
  const topQ=(s.topped>0)?1.12:1;const wtp=p.ref*b.pf*(b.likes[p.cat]||1)*topQ*dm*it.jit;
  const ratio=price/wtp;const rec={b,price,ratio,qty:0,amount:0,plain:!!(G.hasOpt&&s.topped<=0)};
  const ask='Wah, '+p.name+' terlihat enak! Berapa harganya?';
  rec.ask=ask;
  if(s.stock<=0){rec.type='habis';rec.sell='Maaf, stok sudah habis 🙏';rec.say='Yah, sudah habis... aku pulang dulu.';rec.em='😢';rec.tip='Stok habis! Kamu kehilangan calon pembeli. Menghitung jumlah produksi juga penting.';return rec;}
  rec.sell=rp(price)+' satu '+u+'!';
  if(price>b.budget){rec.type='budget';rec.say='Uang jajanku hanya '+rp(b.budget)+'. '+b.no;rec.em='😞';rec.tip='Setiap pembeli punya anggaran. Harga yang melebihi uang pembeli pasti ditolak.';return rec;}
  const k=s.diff==='mudah'?10:s.diff==='sulit'?14:12;
  const prob=1/(1+Math.exp(k*(ratio-1.05)));
  if(it.u<prob){
    let want=1+b.app;if(ratio<.55)want+=2;else if(ratio<.8)want+=1;
    const qty=Math.max(1,Math.min(want,Math.floor(b.budget/price),s.stock,5));
    rec.type='beli';rec.qty=qty;rec.amount=qty*price;
    if(ratio<.8){rec.say=rp(price)+'? Murah banget! Aku beli '+qty+' '+u+'! '+b.buy;rec.em='🤩';rec.tip='Harga murah membuat pembeli membeli lebih banyak. Tapi cek: apakah masih di atas modal?';}
    else{rec.say=rp(price)+'? Boleh juga! Aku beli '+qty+' '+u+'. '+b.buy;rec.em='😍';rec.tip='Harga yang sesuai membuat pembeli mau membeli.';}
    if(rec.plain){rec.say+=' (Tanpa topping ya.)';rec.tip='Produk tanpa topping kurang menarik, jadi pembeli menilainya lebih murah.';}
    if(price<G.mpu)rec.tip='Awas! Harga jualmu di bawah modal. Setiap '+u+' terjual membuatmu rugi.';
    return rec;
  }
  rec.type='mahal';
  if(ratio>1.3){rec.say='Waduh, '+rp(price)+' mahal sekali! Saya tidak jadi membeli. '+b.no;rec.em='😠';}
  else{rec.say='Hmm, '+rp(price)+' agak mahal buatku... lain kali ya. '+b.no;rec.em='😕';}
  rec.tip='Harga yang terlalu tinggi membuat pembeli menolak. Penjualan hilang berarti uang tidak masuk.';
  return rec;
}
function commit(rec){
  const s=G.sim;s.i++;
  if(rec.type==='beli'){s.topped=Math.max(0,s.topped-rec.qty);s.stock-=rec.qty;s.sold+=rec.qty;s.revenue+=rec.amount;s.nBuy++;}
  else if(rec.type==='mahal')s.refMahal++;else if(rec.type==='budget')s.refBudget++;else s.lost++;
  s.log.unshift(rec);if(s.i>=s.queue.length)s.done=true;
}

function logHtml(){const s=G.sim;if(!s.log.length)return '<div class="sub">Belum ada pembeli.</div>';return s.log.map(r=>'<div>'+(r.type==='beli'?'✅ '+esc(r.b.n)+' beli '+r.qty+' ('+rp(r.amount)+')':r.type==='habis'?'⛔ '+esc(r.b.n)+' pergi, stok habis':'❌ '+esc(r.b.n)+' menolak ('+(r.type==='mahal'?'kemahalan':'uang kurang')+')')+'</div>').join('');}

function computeResult(){

  return {sold,unsold,omzet,modalTerjual,labaKotor,biayaTT,laba,kas:G.capital-G.totalCost+omzet,status:laba>0?'untung':laba<0?'rugi':'impas',refMahal:s.refMahal,refBudget:s.refBudget,lost:s.lost,nBuy:s.nBuy,total:s.queue.length};
}

function revealProfit(){
  G.revealed=true;const R=G.result;saveHist();render();$('#main').scrollTop=0;
  if(R.status==='untung'){snd('win');confetti(['🎉','⭐','💰','🏆','✨']);}else if(R.status==='rugi'){snd('lose');confetti(['💪','🌱','⭐']);}else{snd('even');confetti(['⚖️','👍','⭐']);}
}
function checkProfit(){
  const c=G.calc.profit;if(G.revealed)return;const v=parseNum($('#inpProfit').value);const R=G.result;
  if(isNaN(v)){toast('Tulis angka jawabanmu dulu ya!');shake('inpProfit');return;}
  c.tries++;
  if(v===R.laba||(R.laba<0&&v===-R.laba)){c.done=true;c.score=c.tries===1?20:12;toast('Hitunganmu benar! 🎉');revealProfit();}
  else{$('#pfMsg').textContent=c.tries===1?'Belum tepat. Coba lagi ya! Kurangkan omzet dengan total belanja.':'Hitung '+rp(R.omzet)+' − '+rp(G.totalCost)+'. Atau tekan LIHAT JAWABAN.';shake('inpProfit');}
}

    e3:T('Mengapa seorang pengusaha harus menghitung modal sebelum menentukan harga jual?'),

    e5:T('Apa yang bisa terjadi pada usahamu jika harga jual dibuat terlalu mahal? Bagaimana jika terlalu murah?')};

}

/* ---- SCORING & AWARDS ---- */
function computeScores(){
  const R=G.result,mpu=G.mpu,ref=prod().ref,pr=G.price;
  let harga;if(pr<mpu)harga=5;else if(pr>ref*1.5)harga=6;else if(pr>=mpu*1.15&&pr<=ref*1.2)harga=20;else harga=12;
  const sc={modal:G.calc.mpu.score,harga,jual:Math.round(20*R.sold/G.produced),laba:G.calc.profit.score,refleksi:G.reflScore||0};
  sc.total=sc.modal+sc.harga+sc.jual+sc.laba+sc.refleksi;G.scores=sc;return sc;
}

function setS(k,v){
  if(k==='capital'){v=Math.max(20000,Math.min(500000,v));}
  if(k==='buyers'){v=Math.max(10,Math.min(20,v));}
  S[k]=v;store.set('kp_settings',S);
  if(k==='capital'&&G){
    if(screen==='register'||screen==='product'||(screen==='shop'&&cartTotal()<=v)){G.capital=v;}
    else if(['production','pricing','sim','report','worksheet','awards'].includes(screen)||screen==='shop'){toast('Modal baru berlaku di permainan berikutnya.');}
  }
  openTeacher();
  if(screen==='home'||screen==='shop')render(true);
  else if(screen==='register'){const cb=$('.capital b');if(cb)cb.textContent=rp(S.capital);renderTop();}
  else{renderTop();renderNav();}
}

function showQ(i){ui.qi=((i%DISC.length)+DISC.length)%DISC.length;openModal('<div style="font-size:1.1rem;color:#7e57c2">💬 PERTANYAAN DISKUSI '+(ui.qi+1)+' / '+DISC.length+'</div><div class="bigq">'+DISC[ui.qi]+'</div><div class="row" style="justify-content:center"><button class="btn b-gray" onclick="showQ('+(ui.qi-1)+')">◀ SEBELUMNYA</button><button class="btn b-blue" onclick="openTeacher(\'disc\')">DAFTAR SOAL</button><button class="btn b-green" onclick="showQ('+(ui.qi+1)+')">BERIKUTNYA ▶</button></div>',true);}
function tGuide(){
  const c=[['💰','Modal','Uang yang dikeluarkan untuk memulai usaha, misalnya untuk membeli bahan. Contoh: belanja bahan Rp68.000 berarti modalnya Rp68.000.'],['🧮','Harga pokok produksi (modal per produk)','Biaya untuk membuat satu produk. Rumus: Total modal ÷ Jumlah produk. Contoh: Rp68.000 ÷ 20 gelas = Rp3.400 per gelas.'],['🏷️','Harga jual','Harga yang ditawarkan kepada pembeli. Harga jual harus menutup modal dan masih disukai pembeli.'],['💵','Omzet','Seluruh uang yang masuk dari penjualan. Rumus: Jumlah terjual × Harga jual.'],['📈','Keuntungan (laba)','Terjadi jika omzet lebih besar daripada seluruh modal. Rumus: Omzet − Total modal.'],['📉','Kerugian','Terjadi jika omzet lebih kecil daripada seluruh modal. Bahan yang tidak terpakai atau produk yang tidak laku tetap dihitung sebagai biaya.'],['⚖️','Impas','Omzet sama dengan total modal. Modal kembali, tetapi belum ada untung.'],['📣','Strategi pemasaran','Cara membuat pembeli tertarik: harga bersaing, rasa dan kualitas, tampilan menarik, pelayanan ramah, dan promosi.']];
  return '<div class="grid g2">'+c.map(x=>'<div class="card" style="background:#f5faff"><b style="font-size:1.2rem">'+x[0]+' '+x[1]+'</b><p>'+x[2]+'</p></div>').join('')+'</div><div class="card" style="margin-top:1rem;background:#fffde7"><b>🧩 Cara pembeli virtual memutuskan:</b><p>Setiap pembeli punya anggaran, kesukaan, dan kepekaan harga yang berbeda. Makin tinggi harga dibanding harga wajar menurut pembeli, makin kecil peluang ia membeli. Harga yang sangat murah membuat pembeli membeli lebih banyak, tetapi laba per produk mengecil. Hasilnya konsisten untuk satu permainan, sehingga siswa dapat membandingkan akibat dari keputusannya.</p></div>';
}
function tRes(){
  let cur='';
  if(G&&G.result){const R=G.result;cur='<div class="card" style="background:#e8f5e9;margin-bottom:1rem"><b>Permainan sekarang:</b> '+esc(G.name)+' • '+esc(prod().name)+' • harga '+rp(G.price)+' • terjual '+R.sold+'/'+G.produced+' • omzet '+rp(R.omzet)+' • <b class="'+(R.laba<0?'neg':'pos')+'">'+(G.revealed?'laba/rugi '+rp(R.laba):'laba/rugi belum dihitung siswa')+'</b></div>';}
  else cur='<p class="sub">Belum ada hasil permainan yang sedang berjalan.</p>';
  const tb=HIST.length?'<table class="tb"><tr><th>Nama</th><th>Produk</th><th>Harga</th><th>Terjual</th><th>Laba/Rugi</th><th>Skor</th><th>Waktu</th></tr>'+HIST.map(h=>'<tr><td>'+esc(h.name)+(h.group?' ('+esc(h.group)+')':'')+'</td><td>'+esc(h.product)+'</td><td>'+rp(h.price)+'</td><td>'+h.sold+'/'+h.produced+'</td><td class="'+(h.laba<0?'neg':'pos')+'">'+rp(h.laba)+'</td><td>'+(h.score==null?'-':h.score)+'</td><td>'+esc(h.t)+'</td></tr>').join('')+'</table><div style="margin-top:.8rem"><button class="btn b-red sm" onclick="clearHist()">HAPUS RIWAYAT</button></div>':'<p class="sub">Riwayat hasil siswa akan muncul di sini (disimpan di browser ini).</p>';
  return cur+'<h3>📜 Riwayat Hasil</h3>'+tb;
}
function clearHist(){confirmBox('Hapus seluruh riwayat hasil siswa?','YA, HAPUS',()=>{HIST=[];store.set('kp_hist',HIST);openTeacher('res');});}

/* ================= INIT ================= */
window.addEventListener('error',e=>{try{toast('Terjadi kesalahan kecil. Coba tekan tombol lagi.');}catch(x){}});
render();
